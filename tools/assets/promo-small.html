<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 440px; height: 280px; overflow: hidden; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 36px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    background: linear-gradient(150deg, #2563eb 0%, #1e40af 100%);
  }
  .top { display: flex; align-items: center; gap: 16px; }
  img { width: 64px; height: 64px; flex: none; filter: drop-shadow(0 6px 14px rgb(0 0 0 / 0.25)); }
  h1 { font-size: 22px; line-height: 1.15; white-space: nowrap; margin: 0; letter-spacing: -0.02em; }
  p { margin: 0; font-size: 17px; color: #dbeafe; line-height: 1.35; }
  .chip { align-self: flex-start; font: 600 15px ui-monospace, Menlo, monospace; background: #f59e0b; color: #fff; padding: 6px 14px; border-radius: 999px; }
</style></head>
<body>
  <div class="top"><img src="/icons/icon128.png" alt=""><h1>Download<br>Re-Extensioner-o-Matic</h1></div>
  <p>Fix the file extension of downloads automatically.</p>
  <span class="chip">.text → .csv</span>
</body></html>
